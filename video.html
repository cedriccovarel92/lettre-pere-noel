<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Une lettre pour le Père Noël</title>
<meta name="theme-color" content="#0f1a2e">
<meta property="og:title" content="Une lettre pour le Père Noël 🎅">
<meta property="og:description" content="Touchez pour ouvrir la lettre de Johan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Fredoka:wght@400;600&family=Gochi+Hand&family=Playwrite+FR+Moderne:wght@300;400&display=swap">
<style>
html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}
/* Concept : un écran vertical 9:16 posé sur la nuit d'hiver. Une boule à neige, une maison en papier,
   une ombre chinoise d'enfant derrière la fenêtre, puis le ciel du Père Noël. Look unique, volontairement sombre. */
:root{
  --night:#0f1a2e; --night-2:#1b2b4a; --paper:#fffdf7; --ink:#1f3a8a; --red:#c8202f; --gold:#f2c14e;
  --ui:#f4efe4; --ui-dim:#a9b6cc; --line:#33496d;
  --font-hand:"Playwrite FR Moderne","Segoe Script","Bradley Hand",cursive;
  --font-kid:"Gochi Hand","Comic Sans MS","Chalkboard SE",cursive;
  --font-mag:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --font-ui:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--night);color:var(--ui);font-family:var(--font-ui);font-size:15px}
.page{max-width:440px;margin:0 auto;padding-block:18px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}
.head h1{margin:0;font:400 26px/1.2 var(--font-kid);color:var(--gold);text-wrap:balance}
.head p{margin:4px 0 0;color:var(--ui-dim);font-size:14px;line-height:1.4}
.stage{position:relative;width:min(100%,calc((100dvh - 150px)*9/16));margin:0 auto;aspect-ratio:9/16;max-width:100%;border-radius:18px;overflow:hidden;background:#0b1426;
  box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06)}
.world{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0}
.layer{position:absolute;left:0;top:0;width:360px;height:640px}
.abs{position:absolute}
canvas.fx{position:absolute;left:0;top:0;pointer-events:none}

/* 1. Boule à neige */
#globeScene{transform-origin:0 0;background:radial-gradient(ellipse at 50% 35%,#2b4a80 0%,#172a4f 55%,#0d1830 100%)}
.stars{position:absolute;inset:0;opacity:.8;
  background-image:radial-gradient(circle at 12% 14%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 78% 9%,#fff 0 1.2px,transparent 1.8px),
  radial-gradient(circle at 40% 22%,#fff 0 .8px,transparent 1.4px),radial-gradient(circle at 88% 30%,#fff 0 1px,transparent 1.6px),
  radial-gradient(circle at 22% 40%,#fff 0 .9px,transparent 1.5px),radial-gradient(circle at 64% 4%,#fff 0 .8px,transparent 1.4px)}
#globeWrap{left:55px;top:150px;width:250px;height:300px;transform-origin:125px 290px}
.globe{position:absolute;left:0;top:0;width:250px;height:250px;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 50% 40%,#36588f 0%,#223a6a 70%,#1a2f58 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.4),inset 0 -20px 40px rgba(0,0,0,.3),0 0 60px rgba(160,190,255,.22)}
.ground{position:absolute;left:-20px;top:178px;width:290px;height:120px;border-radius:50%;background:radial-gradient(ellipse at 50% 20%,#fff,#e3ebf7 70%)}
.tree{position:absolute;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:44px solid #2a8a5a}
.tree::before{content:"★";position:absolute;left:-6px;top:-12px;font-size:12px;color:var(--gold)}
.house{position:absolute;left:92px;top:118px;width:76px;height:62px;background:#f6c9a3;border-radius:3px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.roof{position:absolute;left:80px;top:84px;width:100px;height:40px;background:#c8505e;clip-path:polygon(50% 0,100% 100%,0 100%)}
.roofsnow{position:absolute;left:84px;top:82px;width:92px;height:22px;background:#fff;clip-path:polygon(50% 0,100% 100%,82% 70%,64% 92%,46% 70%,28% 92%,12% 70%,0 100%)}
.chimney{position:absolute;left:146px;top:86px;width:12px;height:22px;background:#c0574a;box-shadow:inset 0 5px 0 #fff}
#win{position:absolute;left:115px;top:134px;width:30px;height:26px;border-radius:7px;background:#ffd36b;box-shadow:0 0 8px 3px rgba(255,200,90,.6)}
.door{position:absolute;left:150px;top:150px;width:12px;height:30px;background:#8ec5e6;border-radius:6px 6px 0 0}
.snowman{position:absolute;left:30px;top:150px;width:40px;height:56px}
.snowman i{position:absolute;border-radius:50%;background:#fff;box-shadow:inset -3px -3px 0 #dfe7f3}
#globeSnow{position:absolute;left:0;top:0;width:250px;height:250px}
.glass{position:absolute;left:0;top:0;width:250px;height:250px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.55) 0 6%,rgba(255,255,255,.12) 14%,transparent 30%),
  radial-gradient(circle at 72% 80%,rgba(255,255,255,.12),transparent 30%)}
.base{position:absolute;left:18px;top:226px;width:214px;height:66px;clip-path:polygon(9% 0,91% 0,100% 100%,0 100%);
  background:radial-gradient(circle,#fff 0 2.5px,transparent 3px) 0 0/18px 18px,linear-gradient(180deg,#d6404f,#a52a39)}
.plaque{position:absolute;left:77px;top:250px;width:96px;height:26px;border-radius:13px;background:linear-gradient(180deg,#f6d77a,#c99a2e);
  color:#4a2c08;font:400 15px/26px var(--font-kid);text-align:center}

/* 2. La maison et l'ombre de l'enfant */
#houseScene{opacity:0;background:linear-gradient(180deg,#14234a 0%,#22386a 60%,#2c467e 100%)}
#houseCam{transform-origin:0 0}
.light{animation:tw 1.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}

/* 3. Le ciel et la lettre */
#skyScene{opacity:0;background:linear-gradient(180deg,#101d44 0%,#1d3163 60%,#2a4580 100%)}
.tw{position:absolute;color:#fff3c4;line-height:1}
#letter{left:30px;top:50px;width:300px;height:400px;opacity:0;transform-origin:150px 200px;box-shadow:0 18px 34px rgba(0,0,0,.45);border-radius:2px}
.seyes{background-color:var(--paper);
  background-image:linear-gradient(90deg,rgba(150,110,190,.30) 1px,transparent 1px),linear-gradient(rgba(150,110,190,.38) 1px,transparent 1px),linear-gradient(rgba(120,150,210,.2) 1px,transparent 1px);
  background-size:24px 24px,24px 24px,24px 6px}
.seyes::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:1.5px;background:var(--red);opacity:.7}
.stamp{position:absolute;left:224px;top:12px;width:62px;height:62px;border:3px double var(--red);border-radius:50%;
  color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(12deg);
  font:400 9px/1.1 var(--font-mag);letter-spacing:.06em;text-transform:uppercase;opacity:.85;text-align:center}
.stamp b{font-size:14px;font-weight:400}
.l-hello{position:absolute;left:42px;top:46px;font:400 22px/1.4 var(--font-hand);color:var(--red)}
.l-msg{position:absolute;left:42px;top:88px;width:240px;font:300 10.5px/18px var(--font-hand);color:var(--ink)}
.l-title{position:absolute;left:42px;top:128px;font:400 18px var(--font-kid);color:var(--red);transform:rotate(-2deg)}
.mini{position:absolute;width:72px;height:72px;filter:drop-shadow(2px 3px 3px rgba(0,0,0,.28))}
.paper{position:absolute;inset:0;background:#fff}
.ph{position:absolute;inset:5px;display:grid;place-items:center;line-height:1}
.tape{position:absolute;background:rgba(242,193,78,.6);border-left:2px dotted rgba(255,255,255,.6);border-right:2px dotted rgba(255,255,255,.6)}
.lab{position:absolute;font:400 9.5px/1.1 var(--font-mag);text-transform:uppercase;padding:3px 5px 4px;text-align:center;white-space:nowrap}
.l-bisous{position:absolute;left:42px;top:300px;font:300 12px var(--font-hand);color:var(--ink)}
.l-sign{position:absolute;left:42px;top:318px;font:400 26px/1.3 var(--font-hand);color:var(--red)}
.doodle{position:absolute;left:206px;top:300px;width:76px;height:64px}
#swing{position:absolute;left:236px;top:396px;width:0;height:0;transform-origin:0 0}
.string{position:absolute;left:-1px;top:0;width:2px;height:28px;background:#b01e2a}
.tag{position:absolute;left:-68px;top:26px;width:136px;height:50px;background:linear-gradient(180deg,#e2c08c,#d1a96f);
  clip-path:polygon(14% 0,100% 0,100% 100%,14% 100%,0 50%);color:#4f3210;font:400 24px/50px var(--font-kid);text-align:center;padding-left:12px}
.tag::before{content:"";position:absolute;left:12px;top:21px;width:8px;height:8px;border-radius:50%;background:#16264a}
.bow{position:absolute;left:-15px;top:-16px;font-size:26px;line-height:1}
#sleigh{left:0;top:0;width:200px;height:72px;filter:drop-shadow(0 0 6px rgba(255,240,190,.35))}
#dl{position:absolute;left:62px;top:556px;width:236px;height:50px;border:0;border-radius:999px;background:var(--red);color:#fff;
  font:600 17px var(--font-ui);box-shadow:0 8px 20px rgba(200,32,47,.45);opacity:0;pointer-events:none;cursor:pointer}
#dl:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* Ouverture et contrôles */
.start{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(8,14,28,.55);border:0;cursor:pointer;
  color:var(--ui);font:400 26px/1.25 var(--font-kid);padding:0 30px;text-align:center}
.start span{display:inline-block;padding:16px 22px;border-radius:16px;background:rgba(15,26,46,.75);border:1.5px solid rgba(242,193,78,.6)}
.start small{display:block;font:400 13px var(--font-ui);color:var(--ui-dim);margin-top:6px}
.start[hidden]{display:none}
.start:focus-visible{outline:3px solid var(--gold);outline-offset:-6px}
.toast{position:absolute;left:16px;right:16px;bottom:14px;z-index:6;background:rgba(15,26,46,.92);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.35;color:var(--ui);opacity:0;transition:opacity .25s;pointer-events:none}
.timeline{display:flex;gap:4px}
.timeline button{flex:var(--w) 1 0;min-width:0;background:var(--night-2);border:1px solid var(--line);color:var(--ui-dim);
  border-radius:8px;padding:7px 3px;font:600 11px/1.15 var(--font-ui);cursor:pointer;text-align:center}
.timeline button.on{color:var(--ui);border-color:var(--gold)}
.timeline button:focus-visible,.ctrl button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{height:4px;border-radius:2px;background:var(--night-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold)}
.ctrl{display:flex;gap:8px}
.ctrl button{flex:1;font:600 15px var(--font-ui);border-radius:10px;padding:11px;cursor:pointer;border:1px solid #42587d;background:transparent;color:var(--ui)}
.ctrl button.main{background:var(--gold);color:#1b1206;border-color:var(--gold)}
.note{color:var(--ui-dim);font-size:13px;line-height:1.45;margin:0}
.note b{color:var(--ui)}
@media (prefers-reduced-motion:reduce){.light{animation:none}}
.letterImg{display:block;width:100%;height:100%}
</style>
</head>
<body>

<div class="page">
  <div class="head">
    <h1>Une lettre pour le Père Noël</h1>
    <p id="sub">Touchez l'écran pour l'ouvrir, avec le son.</p>
  </div>

  <div class="stage" id="stage">
    <div class="world" id="world">
      <!-- 1. Boule à neige -->
      <div class="layer" id="globeScene">
        <div class="stars"></div>
        <div class="abs" id="globeWrap">
          <div class="globe">
            <div class="ground"></div>
            <div class="tree" style="left:196px;top:140px"></div>
            <div class="tree" style="left:214px;top:156px;transform:scale(.7)"></div>
            <div class="snowman"><i style="left:6px;top:24px;width:28px;height:28px"></i><i style="left:10px;top:6px;width:20px;height:20px"></i>
              <i style="left:15px;top:12px;width:3px;height:3px;background:#2e1d14;box-shadow:none"></i><i style="left:22px;top:12px;width:3px;height:3px;background:#2e1d14;box-shadow:none"></i>
              <i style="left:19px;top:16px;width:8px;height:3px;background:#ff8c42;box-shadow:none;border-radius:0 50% 50% 0"></i>
              <i style="left:8px;top:22px;width:24px;height:5px;background:#ff8fab;box-shadow:none;border-radius:3px"></i></div>
            <div class="chimney"></div><div class="roof"></div><div class="roofsnow"></div>
            <div class="house"></div><div id="win"></div><div class="door"></div>
            <canvas id="globeSnow"></canvas>
            <div class="glass"></div>
          </div>
          <div class="base"></div>
          <div class="plaque">Noël 2026</div>
        </div>
      </div>

      <!-- 2. La maison : l'enfant en ombre chinoise derrière la fenêtre -->
      <div class="layer" id="houseScene">
        <div class="stars"></div>
        <div class="layer" id="houseCam">
          <svg width="360" height="640" viewBox="0 0 360 640" aria-hidden="true">
            <defs>
              <radialGradient id="glow" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#fff3c8"/><stop offset=".55" stop-color="#ffd585"/><stop offset="1" stop-color="#f4a960"/></radialGradient>
              <radialGradient id="lampG" cx="50%" cy="0%" r="100%"><stop offset="0" stop-color="#fffbe6" stop-opacity=".9"/><stop offset="1" stop-color="#fffbe6" stop-opacity="0"/></radialGradient>
              <clipPath id="glassClip"><rect x="0" y="0" width="236" height="194" rx="12"/></clipPath>
              <path id="heart" d="M10 20 C2 14 0 10 0 6 C0 1 5 -1 10 4 C15 -1 20 1 20 6 C20 10 18 14 10 20Z"/>
            </defs>
            <!-- fumée tranquille et cheminée -->
            <g id="smoke" fill="#e8eef8"></g>
            <rect x="248" y="96" width="40" height="100" fill="#c0574a"/>
            <path d="M248 116h40M248 136h40M248 156h40M262 96v20M276 116v20M262 136v20M276 156v20" stroke="#a5463b" stroke-width="2"/>
            <rect x="242" y="86" width="52" height="16" rx="8" fill="#fff"/>
            <!-- mur, toit, neige -->
            <rect x="-10" y="222" width="380" height="430" fill="#f6c9a3"/>
            <path d="M0 260H360M0 288H360M0 316H360M0 344H360M0 372H360M0 400H360M0 428H360M0 456H360M0 484H360M0 512H360M0 540H360M0 568H360M0 596H360" stroke="#ebb48c" stroke-width="2"/>
            <polygon points="-30,232 180,108 390,232" fill="#c8505e"/>
            <polyline points="-34,222 180,98 394,222" fill="none" stroke="#fff" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
            <g id="lights"></g>
            <!-- volets à cœur -->
            <rect x="8" y="296" width="36" height="218" rx="9" fill="#8ec5e6"/><use href="#heart" x="16" y="330" fill="#f6c9a3"/>
            <rect x="316" y="296" width="36" height="218" rx="9" fill="#8ec5e6"/><use href="#heart" x="324" y="330" fill="#f6c9a3"/>
            <!-- fenêtre -->
            <rect x="50" y="296" width="260" height="218" rx="22" fill="#fff8ee"/>
            <g transform="translate(62,308)">
              <g clip-path="url(#glassClip)">
                <rect width="236" height="194" fill="url(#glow)"/>
                <ellipse cx="150" cy="40" rx="70" ry="60" fill="url(#lampG)"/>
                <g fill="#2e1d14">
                  <line x1="150" y1="0" x2="150" y2="26" stroke="#2e1d14" stroke-width="2"/>
                  <path d="M132 40 Q150 20 168 40 Z"/>
                  <!-- chaise -->
                  <rect x="24" y="84" width="6" height="58" rx="3"/><rect x="24" y="134" width="48" height="7" rx="2"/>
                  <rect x="28" y="140" width="5" height="54"/><rect x="64" y="140" width="5" height="54"/>
                  <!-- table -->
                  <rect x="92" y="128" width="170" height="8" rx="2"/><rect x="110" y="136" width="7" height="60"/><rect x="226" y="136" width="7" height="60"/>
                  <!-- l'enfant -->
                  <g id="kid">
                    <g id="legA"><rect x="62" y="128" width="10" height="36" rx="5"/><ellipse cx="70" cy="164" rx="8" ry="5"/></g>
                    <g id="legB"><rect x="56" y="128" width="10" height="34" rx="5"/><ellipse cx="64" cy="162" rx="8" ry="5"/></g>
                    <ellipse cx="50" cy="112" rx="19" ry="24"/>
                    <line x1="56" y1="104" x2="96" y2="124" stroke="#2e1d14" stroke-width="8" stroke-linecap="round"/><circle cx="98" cy="125" r="5"/>
                    <circle cx="56" cy="72" r="19"/><circle cx="74" cy="77" r="3.5"/><circle cx="38" cy="78" r="4"/>
                    <path d="M37 70 Q38 47 57 46 Q77 46 76 67 Z"/><rect x="35" y="64" width="44" height="7" rx="3.5"/><circle cx="60" cy="41" r="7"/>
                    <g id="kidArm">
                      <line x1="62" y1="100" x2="104" y2="118" stroke="#2e1d14" stroke-width="9" stroke-linecap="round"/><circle cx="106" cy="119" r="6"/>
                      <g id="sbA"><path d="M112 120 L134 112 L132 117 Z"/></g><g id="sbB"><path d="M112 120 L134 122 L131 117 Z"/></g>
                      <circle cx="112" cy="120" r="2.5"/>
                    </g>
                  </g>
                </g>
                <!-- la lettre posée, puis emportée -->
                <g id="paperIn"><rect x="112" y="121" width="64" height="7" rx="1" fill="#fffaf0"/>
                  <rect x="120" y="122" width="7" height="5" fill="#ff8fab"/><rect x="134" y="122" width="7" height="5" fill="#8ecae6"/><rect x="148" y="122" width="7" height="5" fill="#95d5b2"/></g>
                <g id="paperFly" opacity="0"><rect x="-20" y="-26" width="40" height="52" fill="#fffdf7" stroke="#e5d8c8"/><path d="M-12 -26V26" stroke="#c8202f" stroke-width="1"/>
                  <rect x="-8" y="-6" width="9" height="9" fill="#ff8fab"/><rect x="4" y="-6" width="9" height="9" fill="#8ecae6"/><rect x="-2" y="8" width="9" height="9" fill="#95d5b2"/></g>
                <g id="bits"></g>
                <path id="curL" d="M0 0 H38 Q34 60 16 98 Q34 140 28 194 H0 Z" fill="#f7a8b8"/>
                <path id="curR" d="M236 0 H198 Q202 60 220 98 Q202 140 208 194 H236 Z" fill="#f7a8b8"/>
                <rect x="10" y="94" width="12" height="7" rx="3" fill="#e06c88"/><rect x="214" y="94" width="12" height="7" rx="3" fill="#e06c88"/>
              </g>
            </g>
            <!-- houx, rebord enneigé, sol -->
            <ellipse cx="170" cy="296" rx="12" ry="6" fill="#2a8a5a" transform="rotate(-20 170 296)"/><ellipse cx="190" cy="296" rx="12" ry="6" fill="#2a8a5a" transform="rotate(20 190 296)"/>
            <circle cx="177" cy="300" r="4" fill="#d6303f"/><circle cx="185" cy="301" r="4" fill="#d6303f"/>
            <rect x="38" y="508" width="284" height="16" rx="8" fill="#fff8ee"/>
            <path d="M44 510 Q60 496 78 506 Q96 494 116 506 Q140 496 162 506 Q186 494 208 506 Q232 496 254 506 Q276 494 298 506 Q312 500 318 510 Z" fill="#fff"/>
            <path d="M-10 640 V606 Q30 590 70 604 Q110 588 150 602 Q190 586 230 602 Q270 588 310 604 Q340 594 370 606 V640 Z" fill="#fff"/>
            <!-- la lettre sort par la cheminée -->
            <g id="poof" fill="#f2f5fb"></g>
            <g id="paperOut" opacity="0"><rect x="-20" y="-26" width="40" height="52" fill="#fffdf7" stroke="#e5d8c8"/><path d="M-12 -26V26" stroke="#c8202f" stroke-width="1"/>
              <rect x="-8" y="-6" width="9" height="9" fill="#ff8fab"/><rect x="4" y="-6" width="9" height="9" fill="#8ecae6"/><rect x="-2" y="8" width="9" height="9" fill="#95d5b2"/></g>
          </svg>
        </div>
        <canvas class="fx" id="houseSnow"></canvas>
      </div>

      <!-- 3. Le ciel, la lettre, le traîneau -->
      <div class="layer" id="skyScene">
        <div id="twinkles"></div>
        <svg class="abs" style="left:258px;top:48px" width="62" height="62" viewBox="0 0 62 62" aria-hidden="true">
          <circle cx="31" cy="31" r="29" fill="#fbf3cf"/><circle cx="31" cy="31" r="29" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="6" filter="blur(4px)"/>
          <path d="M18 28 q4 4 8 0 M36 28 q4 4 8 0" stroke="#7a5b3a" stroke-width="2" fill="none" stroke-linecap="round"/>
          <circle cx="16" cy="36" r="4" fill="#ffb3c1"/><circle cx="46" cy="36" r="4" fill="#ffb3c1"/>
          <path d="M26 39 q5 5 10 0" stroke="#7a5b3a" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
        <canvas class="fx" id="skyCanvas"></canvas>
        <svg class="abs" style="left:0;top:520px" width="360" height="120" viewBox="0 0 360 120" aria-hidden="true">
          <path d="M0 60 L30 60 L30 40 L60 18 L90 40 L90 60 L120 60 L120 30 L150 8 L180 30 L180 60 L210 60 L210 46 L240 22 L270 46 L270 60 L300 60 L300 34 L330 12 L360 34 L360 120 L0 120 Z" fill="#0c1630"/>
